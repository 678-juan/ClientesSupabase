<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-page">
  <main class="page">
    <section class="card stack" style="max-width: 420px;">
      <h1 class="title">Iniciar sesión¿?</h1>

      <form id="authForm" class="stack">
        <input id="authEmail" class="input" type="email" placeholder="usuario@correo.com" />
        <input id="authPassword" class="input" type="password" placeholder="Contraseña" />
        <input id="authConfirmPassword" class="input" type="password" placeholder="Confirmar contraseña" style="display: none;" />
        <button id="submitBtn" class="button primary" type="submit">Entrar</button>
        <button id="toggleBtn" class="button ghost" type="button">Crear cuenta</button>
      </form>

      <div id="result" class="message small" aria-live="polite"></div>
    </section>
  </main>

  <script src="../js/login.js"></script>
</body>
</html>
